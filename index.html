<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Studio NBV • Master V19</title>
    <script src="database.js"></script>
    <style>
        :root { --brand: #2da44e; --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #24292f; --accent: #0969da; --danger: #cf222e; }
        body { font-family: -apple-system, monospace; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        .card-header { padding: 15px; background: #f6f8fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; user-select: none; }
        .card-body { padding: 20px; display: none; }
        .card-body.show { display: block; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 5px; font-family: monospace; box-sizing: border-box; }
        .btn { padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-save { background: var(--accent); color: #fff; }
        .btn-danger { background: #fff0f0; color: var(--danger); border: 1px solid var(--danger); }
        .btn-mini { width: auto; padding: 5px 10px; margin: 0; font-size: 12px; background:#eee; border:1px solid #ccc; cursor:pointer;}
        .row { display: flex; gap: 15px; } .col { flex: 1; }
        .drop-zone { border: 2px dashed var(--border); padding: 40px; text-align: center; background: #fff; cursor: pointer; border-radius: 6px; transition: .2s; }
        .drop-zone.dragover { background: #dafbe1; border-color: var(--brand); transform: scale(1.02); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 15px; display:none; }
        .progress-fill { height: 100%; background: var(--brand); width: 0%; transition: width .2s; }
        .final-link { background: #ddf4ff; padding: 20px; text-align: center; display: none; margin-top: 20px; border: 1px solid var(--accent); border-radius: 6px; }
        .final-link a { font-size: 18px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<h1>🚀 Studio NBV • Master V19 (Link Seguro)</h1>

<div class="card">
    <div class="card-header" onclick="toggle('ghConfig', this)">🔐 GitHub ▼</div>
    <div id="ghConfig" class="card-body">
        <input type="password" id="ghToken" placeholder="Token" onchange="saveConfig()">
        <div class="row">
            <div class="col"><input type="text" id="ghUser" placeholder="User" onchange="saveConfig()"></div>
            <div class="col"><input type="text" id="ghRepo" placeholder="Repo" onchange="saveConfig()"></div>
        </div>
    </div>
</div>

<div class="card" style="border-left: 4px solid #0969da;">
    <div class="card-header" onclick="toggle('priceEditor', this)">💰 Tabela e Preços ▼</div>
    <div id="priceEditor" class="card-body">
        <h3>1. Produtos Avulsos</h3>
        <div id="visualList"></div>
        <button class="btn-mini" onclick="addProductRow('','')">+ Add Produto</button>

        <h3>2. Tabela Fotolivro</h3>
        <div class="row">
            <div class="col"><label>Markup</label><input type="number" id="calcMarkup" step="0.1"></div>
            <div class="col"><label>Custo Fixo</label><input type="number" id="calcCusto"></div>
        </div>
        <textarea id="txtTable" rows="8" placeholder="30x40, 20, 592, 754..."></textarea>

        <h3>3. Padrão Global</h3>
        <div class="row">
            <div class="col"><label>Inclusas (Padrão)</label><input type="number" id="dbIncluso"></div>
            <div class="col"><label>Extra (R$ Padrão)</label><input type="number" id="dbExtra"></div>
        </div>
        <button class="btn btn-save" onclick="savePricesToGitHub()">💾 SALVAR TUDO</button>
    </div>
</div>

<div class="card">
    <div class="card-header active" style="background:#fff" onclick="toggle('generator', this)">📸 Nova Galeria ▼</div>
    <div id="generator" class="card-body show">
        <label>Nome do Cliente (Ex: Maria 15 Anos)</label>
        <input type="text" id="clientName" placeholder="Maria 15 Anos">
        <p style="font-size:11px; color:#666; margin-top:2px">⚠️ Será adicionado um código único ao link para evitar duplicidade.</p>
        
        <label>Fotos</label>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
        <div class="drop-zone" id="dropZone">📂 Clique ou Arraste as Fotos Aqui</div>
        
        <div id="statusBox" style="margin-top:10px; font-weight:bold; color:var(--brand); display:none"></div>
        <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>

        <label style="color:#0969da; margin-top:20px">🎁 Brindes / Créditos</label>
        <div class="row">
            <div class="col" style="flex:2"><select id="giftSelector"></select></div>
            <div class="col"><input type="number" id="giftQtd" value="1"></div>
            <div class="col"><button class="btn-mini" style="background:#0969da; color:#fff; height:38px; margin-top:5px" onclick="addGift()">Add</button></div>
        </div>
        <div id="giftDisplay" style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap"></div>

        <div class="row">
            <div class="col"><label>Sinal Pago (R$)</label><input type="number" id="valEntrada" value="0"></div>
        </div>

        <button class="btn btn-primary" id="btnDeploy" onclick="deploy()">🚀 CRIAR GALERIA</button>
    </div>
</div>

<div class="card" style="border-color: #cf222e;">
    <div class="card-header" onclick="toggle('maint', this)">🧹 Manutenção ▼</div>
    <div id="maint" class="card-body">
        <button class="btn btn-danger" onclick="runCleanup()">🗑️ LIMPAR (>60 DIAS)</button>
    </div>
</div>

<div id="finalLink" class="final-link"></div>

<script>
let selectedFiles=[], clientGifts=[];

window.onload=()=>{
    ['ghToken','ghUser','ghRepo'].forEach(k=>{if(localStorage.getItem(k))document.getElementById(k).value=localStorage.getItem(k)});
    if(typeof DB_CONFIG!=='undefined'){
        document.getElementById('visualList').innerHTML='';
        DB_CONFIG.produtos.forEach(p=>addProductRow(p.nome,p.preco));
        if(DB_CONFIG.calculo?.tabela) {
            document.getElementById('txtTable').value = DB_CONFIG.calculo.tabela.map(t=>`${t.size}, ${t.pages}, ${t.price}, ${t.priceBox}`).join('\n');
            document.getElementById('calcMarkup').value = DB_CONFIG.calculo.markup;
            document.getElementById('calcCusto').value = DB_CONFIG.calculo.custoFixo;
        }
        document.getElementById('dbIncluso').value=DB_CONFIG.album.incluso;
        document.getElementById('dbExtra').value=DB_CONFIG.album.extra;
        let s=document.getElementById('giftSelector');
        DB_CONFIG.produtos.forEach(p=>{let o=document.createElement('option');o.value=p.nome;o.innerText=p.nome;s.appendChild(o)});
    }
    
    const dz = document.getElementById('dropZone');
    const fi = document.getElementById('fileInput');
    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', (e) => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover'); });
    dz.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover'); if(e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files); });
}

function toggle(id,h){ let el=document.getElementById(id); if(el.classList.contains('show')){el.classList.remove('show');}else{el.classList.add('show');} }
function addProductRow(n,p){ let d=document.createElement('div');d.className='prod-row';d.style.marginBottom='5px';d.innerHTML=`<input type="text" class="inp-name" value="${n}" placeholder="Nome" style="width:60%"><input type="number" class="inp-price" value="${p}" placeholder="R$" style="width:25%"><button class="btn-mini btn-danger" onclick="this.parentElement.remove()" style="width:10%">X</button>`;document.getElementById('visualList').appendChild(d); }
function addGift(){ let s=document.getElementById('giftSelector'), q=document.getElementById('giftQtd'); if(!s.value)return; clientGifts.push({nome:s.value,qtd:parseInt(q.value)}); document.getElementById('giftDisplay').innerHTML+=`<span style="background:#0969da;color:white;padding:4px 8px;border-radius:12px;font-size:12px">${q.value}x ${s.value}</span>`; }

function handleFiles(f){ 
    selectedFiles=Array.from(f); 
    document.getElementById('statusBox').style.display='block'; 
    document.getElementById('statusBox').innerText=`✅ ${selectedFiles.length} FOTOS CARREGADAS`; 
    document.getElementById('dropZone').innerText = `✅ ${selectedFiles.length} fotos.`;
    document.getElementById('dropZone').style.background = '#f0fff4';
}

async function savePricesToGitHub(){
    let prods=[]; document.querySelectorAll('.prod-row').forEach(r=>{let n=r.querySelector('.inp-name').value, p=parseFloat(r.querySelector('.inp-price').value); if(n) prods.push({nome:n,preco:p});});
    let tableData=[]; document.getElementById('txtTable').value.split('\n').forEach(l=>{let p=l.split(','); if(p.length>=4) tableData.push({size:p[0].trim(),pages:parseInt(p[1]),price:parseFloat(p[2]),priceBox:parseFloat(p[3])})});
    
    let newDB={ album:{incluso:parseFloat(document.getElementById('dbIncluso').value),extra:parseFloat(document.getElementById('dbExtra').value)}, calculo:{markup:parseFloat(document.getElementById('calcMarkup').value),custoFixo:parseFloat(document.getElementById('calcCusto').value),regras:{'15x20':2,'20x30':4,'30x40':5},tabela:tableData}, produtos:prods, creditos:[] };
    
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    let url=`https://api.github.com/repos/${user}/${repo}/contents/database.js`;
    let content=`// Config Studio NBV\nconst DB_CONFIG = ${JSON.stringify(newDB,null,4)};`;
    
    try {
        let check=await fetch(url,{headers:{Authorization:`token ${token}`}});
        let sha=(await check.json()).sha;
        await fetch(url,{method:'PUT',headers:{Authorization:`token ${token}`},body:JSON.stringify({message:"Update DB",content:btoa(content),sha:sha,branch:"main"})});
        alert("✅ Salvo! Recarregue."); location.reload();
    } catch(e){alert("Erro: "+e.message)}
}

async function deploy(){
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    let rawName=document.getElementById('clientName').value.trim();
    
    if(!rawName || !selectedFiles.length) return alert("Falta nome ou fotos!");
    
    // --- GERAÇÃO DE SUFIXO ÚNICO ---
    // Cria um código aleatório de 4 caracteres (ex: a1b2)
    let uniqueId = Math.random().toString(36).substring(2, 6);
    let urlName = rawName.toLowerCase().replace(/[^a-z0-9-]/g,'-') + '-' + uniqueId;
    
    document.getElementById('progBar').style.display='block';
    document.getElementById('btnDeploy').disabled=true;
    let fill=document.getElementById('progFill');
    let fileNames=[];
    
    try {
        for(let i=0; i<selectedFiles.length; i++){
            let f=selectedFiles[i]; fill.style.width=((i/selectedFiles.length)*90)+'%';
            let reader=new FileReader(); let b64=await new Promise(r=>{reader.onload=()=>r(reader.result.split(',')[1]);reader.readAsDataURL(f)});
            let path=`clientes/${urlName}/${f.name}`;
            // Não precisa checar SHA pois a pasta é garantidamente nova
            await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${token}`},body:JSON.stringify({message:`Img`,content:b64,branch:'main'})});
            fileNames.push(f.name);
        }

        let configIncluso = document.getElementById('dbIncluso').value;
        let configExtra = document.getElementById('dbExtra').value;

        let htmlLeve = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>${rawName}</title>
    <link rel="stylesheet" href="../../style.css"> 
</head>
<body>
    <script>
        const CLIENT_DATA = {
            clientName: "${rawName}",
            fotos: [${fileNames.map(f=>`"${f}"`).join(',')}],
            produtos: ${JSON.stringify(DB_CONFIG.produtos)},
            creditos: ${JSON.stringify(clientGifts)},
            entrada: ${document.getElementById('valEntrada').value},
            albumConfig: { incluso: ${configIncluso}, extra: ${configExtra} }
        };
    <\/script>
    <script src="../../engine.js"><\/script>
</body>
</html>`;

        let hPath=`clientes/${urlName}/index.html`;
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${hPath}`,{method:'PUT',headers:{Authorization:`token ${token}`},body:JSON.stringify({message:`HTML V19`,content:btoa(unescape(encodeURIComponent(htmlLeve))),branch:'main'})});

        fill.style.width='100%';
        let link=`https://${user}.github.io/${repo}/clientes/${urlName}/`;
        document.getElementById('finalLink').style.display='block';
        document.getElementById('finalLink').innerHTML=`<a href="${link}" target="_blank">ABRIR GALERIA (${rawName})</a>`;
    } catch(e){ alert("Erro: "+e.message); } finally { document.getElementById('btnDeploy').disabled=false; }
}

async function runCleanup(){
    if(!confirm("⚠️ Confirmar limpeza (+60 dias)?")) return;
    alert("Iniciando limpeza...");
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    try {
        let items = await(await fetch(`https://api.github.com/repos/${user}/${repo}/contents/clientes`,{headers:{Authorization:`token ${token}`}})).json();
        let now=new Date();
        for(let item of items){
            if(item.type==='dir'){
                let cData=await(await fetch(`https://api.github.com/repos/${user}/${repo}/commits?path=${item.path}/index.html&page=1&per_page=1`,{headers:{Authorization:`token ${token}`}})).json();
                if(cData.length>0){
                    if(Math.ceil(Math.abs(now-new Date(cData[0].commit.committer.date))/(86400000))>60){
                        let files=await(await fetch(item.url,{headers:{Authorization:`token ${token}`}})).json();
                        for(let f of files) await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:"Cleanup",sha:f.sha,branch:"main"})});
                    }
                }
            }
        }
        alert("Limpeza OK!");
    } catch(e){alert("Erro: "+e.message)}
}
function saveConfig(){ ['ghToken','ghUser','ghRepo'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value)); }
</script>
</body>
</html>
