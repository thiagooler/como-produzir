<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Studio NBV • V24 (Correção Drive)</title>
    <script src="database.js"></script>
    <style>
        :root { --brand: #2da44e; --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #24292f; --accent: #0969da; --danger: #cf222e; }
        body { font-family: -apple-system, monospace; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        .card-header { padding: 15px; background: #f6f8fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; user-select: none; }
        .card-body { padding: 20px; display: none; }
        .card-body.show { display: block; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 5px; font-family: monospace; box-sizing: border-box; }
        .btn { padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-save { background: var(--accent); color: #fff; }
        .btn-danger { background: #fff0f0; color: var(--danger); border: 1px solid var(--danger); }
        .btn-mini { width: auto; padding: 5px 10px; margin: 0; font-size: 12px; background:#eee; border:1px solid #ccc; cursor:pointer;}
        .row { display: flex; gap: 15px; } .col { flex: 1; }
        
        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-opt { flex: 1; padding: 10px; text-align: center; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: #eee; font-weight: bold; color: #666; transition: .2s; }
        .mode-opt.active { background: #dafbe1; border-color: var(--brand); color: var(--brand); }
        .mode-opt:hover { opacity: 0.8; }

        .drop-zone { border: 2px dashed var(--border); padding: 40px; text-align: center; background: #fff; cursor: pointer; border-radius: 6px; margin-top:10px; }
        .drop-zone.dragover { background: #dafbe1; border-color: var(--brand); }
        
        .final-link { background: #ddf4ff; padding: 20px; text-align: center; display: none; margin-top: 20px; border: 1px solid var(--accent); border-radius: 6px; }
        .final-link a { font-size: 18px; font-weight: bold; color: var(--accent); text-decoration: none; }
        
        .status-box { margin-top:10px; padding:10px; border-radius:4px; font-weight:bold; display:none; }
        .status-success { background:#e6ffec; border:1px solid #00a000; color:#005000; }
        .status-error { background:#fff0f0; border:1px solid var(--danger); color:var(--danger); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<h1>🚀 Studio NBV • Master V24</h1>

<div class="card">
    <div class="card-header" onclick="toggle('config', this)">⚙️ Configurações (GitHub) ▼</div>
    <div id="config" class="card-body">
        <label>GitHub Token</label><input type="password" id="ghToken" onchange="saveConfig()">
        <div class="row">
            <div class="col"><input type="text" id="ghUser" placeholder="User" onchange="saveConfig()"></div>
            <div class="col"><input type="text" id="ghRepo" placeholder="Repo" onchange="saveConfig()"></div>
        </div>
    </div>
</div>

<div class="card" style="border-left: 4px solid #0969da;">
    <div class="card-header" onclick="toggle('priceEditor', this)">💰 Tabela e Preços ▼</div>
    <div id="priceEditor" class="card-body">
        <h3>1. Produtos</h3>
        <div id="visualList"></div>
        <button class="btn-mini" onclick="addProductRow('','')">+ Add Produto</button>
        <h3>2. Tabela Álbum</h3>
        <textarea id="txtTable" rows="5"></textarea>
        <h3>3. Padrão</h3>
        <div class="row">
            <div class="col"><label>Inclusas</label><input type="number" id="dbIncluso"></div>
            <div class="col"><label>Extra (R$)</label><input type="number" id="dbExtra"></div>
        </div>
        <button class="btn btn-save" onclick="savePricesToGitHub()">💾 SALVAR NO GITHUB</button>
    </div>
</div>

<div class="card">
    <div class="card-header active" style="background:#fff" onclick="toggle('generator', this)">📸 Gerador de Galeria ▼</div>
    <div id="generator" class="card-body show">
        <label>Nome do Cliente</label>
        <input type="text" id="clientName" placeholder="Ex: Maria 15 Anos">
        
        <label style="margin-top:15px; display:block">Origem das Fotos:</label>
        <div class="mode-selector">
            <div class="mode-opt active" onclick="setMode('drive')" id="tabDrive">☁️ Google Drive</div>
            <div class="mode-opt" onclick="setMode('upload')" id="tabUpload">📁 Upload PC</div>
        </div>

        <div id="areaDrive">
            <input type="text" id="folderLink" placeholder="Link da Pasta do Drive (Qualquer pessoa com link)..." oninput="autoExtractId()">
            <input type="hidden" id="folderId">
            <button class="btn" style="background:#FFD04B; color:#333; margin-top:10px" onclick="fetchDrive()" id="btnFetch">🔍 1. Verificar Pasta</button>
            <div id="statusDrive" class="status-box"></div>
        </div>

        <div id="areaUpload" class="hidden">
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
            <div class="drop-zone" id="dropZone">📂 Clique ou Arraste as Fotos</div>
            <div id="statusUpload" class="status-box status-success"></div>
            <div style="background:#eee; height:10px; margin-top:10px; border-radius:5px"><div id="progFill" style="background:var(--brand); width:0%; height:100%; transition:width .2s"></div></div>
        </div>

        <label style="color:#0969da; margin-top:20px">🎁 Brindes / Créditos</label>
        <div class="row">
            <div class="col" style="flex:2"><select id="giftSelector"></select></div>
            <div class="col"><input type="number" id="giftQtd" value="1"></div>
            <div class="col"><button class="btn-mini" style="background:#0969da; color:#fff; height:38px; margin-top:5px" onclick="addGift()">Add</button></div>
        </div>
        <div id="giftDisplay" style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap"></div>

        <div class="row">
            <div class="col"><label>Sinal Pago (R$)</label><input type="number" id="valEntrada" value="0"></div>
        </div>

        <button class="btn btn-primary" id="btnDeploy" onclick="deploy()">🚀 2. CRIAR GALERIA</button>
    </div>
</div>

<div id="finalLink" class="final-link"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzUz4P79a9JJyX6lxncPhcoDBtuwuTf5VThBbE0VfZ9IhoP5ODPhTg6qFvz-ImchbbH/exec";

let clientGifts=[], selectedFiles=[], drivePhotos=[], currentMode='drive';

window.onload=()=>{
    ['ghToken','ghUser','ghRepo'].forEach(k=>{if(localStorage.getItem(k))document.getElementById(k).value=localStorage.getItem(k)});
    if(typeof DB_CONFIG!=='undefined'){
        document.getElementById('visualList').innerHTML='';
        DB_CONFIG.produtos.forEach(p=>addProductRow(p.nome,p.preco));
        if(DB_CONFIG.calculo?.tabela) document.getElementById('txtTable').value = DB_CONFIG.calculo.tabela.map(t=>`${t.size}, ${t.pages}, ${t.price}, ${t.priceBox}`).join('\n');
        document.getElementById('dbIncluso').value=DB_CONFIG.album.incluso;
        document.getElementById('dbExtra').value=DB_CONFIG.album.extra;
        let s=document.getElementById('giftSelector');
        DB_CONFIG.produtos.forEach(p=>{let o=document.createElement('option');o.value=p.nome;o.innerText=p.nome;s.appendChild(o)});
    }
    const dz = document.getElementById('dropZone');
    dz.addEventListener('click', () => document.getElementById('fileInput').click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('dragover'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}

function toggle(id,h){ let el=document.getElementById(id); el.classList.toggle('show'); }
function setMode(m){ 
    currentMode=m; 
    document.getElementById('tabDrive').className = m==='drive'?'mode-opt active':'mode-opt';
    document.getElementById('tabUpload').className = m==='upload'?'mode-opt active':'mode-opt';
    document.getElementById('areaDrive').classList.toggle('hidden', m!=='drive');
    document.getElementById('areaUpload').classList.toggle('hidden', m!=='upload');
}
function addProductRow(n,p){ let d=document.createElement('div');d.className='prod-row';d.style.marginBottom='5px';d.innerHTML=`<input type="text" class="inp-name" value="${n}" style="width:60%"><input type="number" class="inp-price" value="${p}" style="width:25%"><button class="btn-mini btn-danger" onclick="this.parentElement.remove()" style="width:10%">X</button>`;document.getElementById('visualList').appendChild(d); }
function addGift(){ let s=document.getElementById('giftSelector'), q=document.getElementById('giftQtd'); if(!s.value)return; clientGifts.push({nome:s.value,qtd:parseInt(q.value)}); document.getElementById('giftDisplay').innerHTML+=`<span style="background:#0969da;color:white;padding:4px 8px;border-radius:12px;font-size:12px">${q.value}x ${s.value}</span>`; }
function saveConfig(){ ['ghToken','ghUser','ghRepo'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value)); }

function handleFiles(f){ selectedFiles=Array.from(f); document.getElementById('statusUpload').style.display='block'; document.getElementById('statusUpload').innerText=`✅ ${selectedFiles.length} Fotos Locais Prontas`; }

function autoExtractId() {
    let input = document.getElementById('folderLink').value;
    let idBox = document.getElementById('folderId');
    let match = input.match(/[-\w]{25,}/); 
    if(match) idBox.value = match[0]; else idBox.value = input;
}

async function fetchDrive(){
    autoExtractId();
    let fid = document.getElementById('folderId').value.trim();
    if(!fid) return alert("Cole o link da pasta primeiro.");
    let btn=document.getElementById('btnFetch'); let status=document.getElementById('statusDrive');
    btn.disabled=true; btn.innerText="Buscando..."; status.style.display='none';
    try {
        let res=await fetch(`${GAS_URL}?folderId=${fid}`);
        let data=await res.json();
        if(Array.isArray(data)){
            if(data.length === 0) { status.style.display='block'; status.className='status-box status-error'; status.innerText="⚠️ Pasta vazia."; } 
            else { drivePhotos=data; status.style.display='block'; status.className='status-box status-success'; status.innerHTML=`✅ <strong>${data.length} fotos</strong> encontradas!`; }
        } else throw new Error(data);
    } catch(e){ status.style.display='block'; status.className='status-box status-error'; status.innerText="Erro: "+e.message; }
    finally { btn.disabled=false; btn.innerText="🔍 1. Verificar Pasta"; }
}

async function deploy(){
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    let rawName=document.getElementById('clientName').value.trim();
    if(!rawName) return alert("Nome do cliente obrigatório.");
    
    let finalPhotos = [];
    if(currentMode === 'drive'){
        if(!drivePhotos.length) return alert("Busque as fotos no Drive primeiro.");
        finalPhotos = drivePhotos; // Agora envia OBJETOS {name, url}
    } else {
        if(!selectedFiles.length) return alert("Selecione fotos.");
        // Upload não é o foco do erro, mantemos lógica simplificada
    }

    let uniqueId = Math.random().toString(36).substring(2, 6);
    let urlName = rawName.toLowerCase().replace(/[^a-z0-9-]/g,'-') + '-' + uniqueId;
    let btn=document.getElementById('btnDeploy'); btn.disabled=true; btn.innerText="Processando...";
    
    try {
        if(currentMode === 'upload'){
            let uploadedNames = [];
            for(let i=0; i<selectedFiles.length; i++){
                let f=selectedFiles[i];
                document.getElementById('progFill').style.width=((i/selectedFiles.length)*90)+'%';
                let reader=new FileReader();
                let b64=await new Promise(r=>{reader.onload=()=>r(reader.result.split(',')[1]);reader.readAsDataURL(f)});
                let safeName = f.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                await fetch(`https://api.github.com/repos/${user}/${repo}/contents/clientes/${urlName}/${safeName}`,{
                    method:'PUT', headers:{Authorization:`token ${token}`},
                    body:JSON.stringify({message:`Img`, content:b64, branch:'main'})
                });
                uploadedNames.push(safeName); // No modo upload, salvamos apenas a string do nome, pois a URL é relativa
            }
            finalPhotos = uploadedNames;
        }

        let jsData = {
            clientName: rawName,
            fotos: finalPhotos,
            produtos: DB_CONFIG.produtos,
            creditos: clientGifts,
            entrada: parseFloat(document.getElementById('valEntrada').value)||0,
            albumConfig: { incluso: parseFloat(document.getElementById('dbIncluso').value)||0, extra: parseFloat(document.getElementById('dbExtra').value)||0 },
            calculoConfig: DB_CONFIG.calculo
        };

        // AQUI ESTÁ O TRUQUE PARA A FOTO NÃO QUEBRAR: meta referrer="no-referrer"
        let html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>${rawName}</title><link rel="stylesheet" href="../../style.css"></head><body><script>const CLIENT_DATA = ${JSON.stringify(jsData, null, 2)};<\/script><script src="../../engine.js"><\/script></body></html>`;
        
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/clientes/${urlName}/index.html`,{
            method:'PUT', headers:{Authorization:`token ${token}`},
            body:JSON.stringify({message:`Galeria ${rawName}`, content:btoa(unescape(encodeURIComponent(html))), branch:'main'})
        });

        document.getElementById('finalLink').style.display='block';
        document.getElementById('finalLink').innerHTML=`<a href="https://${user}.github.io/${repo}/clientes/${urlName}/" target="_blank">✅ ABRIR GALERIA</a>`;
        if(currentMode==='upload') document.getElementById('progFill').style.width='100%';

    } catch(e){ alert("Erro: "+e.message); }
    finally { btn.disabled=false; btn.innerText="🚀 CRIAR GALERIA"; }
}

async function savePricesToGitHub(){
    let prods=[]; document.querySelectorAll('.prod-row').forEach(r=>{let n=r.querySelector('.inp-name').value, p=parseFloat(r.querySelector('.inp-price').value); if(n) prods.push({nome:n,preco:p});});
    let tableData=[]; document.getElementById('txtTable').value.split('\n').forEach(l=>{let p=l.split(','); if(p.length>=4) tableData.push({size:p[0].trim(),pages:parseInt(p[1]),price:parseFloat(p[2]),priceBox:parseFloat(p[3])})});
    let newDB={ album:{incluso:parseFloat(document.getElementById('dbIncluso').value),extra:parseFloat(document.getElementById('dbExtra').value)}, calculo:{markup:DB_CONFIG.calculo.markup,custoFixo:DB_CONFIG.calculo.custoFixo,regras:DB_CONFIG.calculo.regras,tabela:tableData}, produtos:prods, creditos:[] };
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/database.js`,{method:'PUT',headers:{Authorization:`token ${token}`},body:JSON.stringify({message:"Update DB",content:btoa(`// Config Studio NBV\nconst DB_CONFIG = ${JSON.stringify(newDB,null,4)};`),branch:"main"})});
    alert("✅ Salvo! Recarregue."); location.reload();
}
</script>
</body>
</html>
