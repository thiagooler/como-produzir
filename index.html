<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Studio NBV • Master V6</title>
    <script src="database.js"></script>
    <style>
        :root { --brand: #2da44e; --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #24292f; --accent: #0969da; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        h2 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 5px; font-family: monospace; }
        .row { display: flex; gap: 10px; } .col { flex: 1; }
        button { padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-save { background: var(--accent); color: white; }
        .hidden { display: none; }
        
        /* Visual Editor */
        .prod-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .btn-del { background: #cf222e; color: white; width: 40px; }
        
        /* Drag Drop */
        .drop-zone { border: 2px dashed var(--border); padding: 30px; text-align: center; background: #fff; cursor: pointer; }
        .drop-zone:hover { background: #f0fff4; border-color: var(--brand); }
        
        /* Progress */
        .progress-bar { height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin-top: 15px; display:none; }
        .progress-fill { height: 100%; background: var(--brand); width: 0%; transition: width .2s; }
        
        .status-box { background: #dafbe1; color: var(--brand); padding: 10px; text-align: center; border-radius: 6px; margin-top: 10px; display: none; font-weight: bold; }
        .final-link { background: #ddf4ff; padding: 15px; text-align: center; display: none; margin-top: 20px; border: 1px solid var(--accent); }
        .final-link a { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<h1>🚀 Studio NBV • Gerador V6</h1>

<div class="card">
    <h2>🔐 GitHub</h2>
    <input type="password" id="ghToken" placeholder="Token" onchange="saveConfig()">
    <div class="row">
        <div class="col"><input type="text" id="ghUser" placeholder="User" onchange="saveConfig()"></div>
        <div class="col"><input type="text" id="ghRepo" placeholder="Repo" onchange="saveConfig()"></div>
    </div>
</div>

<div class="card" style="border-left: 4px solid #0969da;">
    <h2>💰 Editar Preços e Tabelas</h2>
    
    <label>1. Produtos Avulsos</label>
    <div id="visualList"></div>
    <button style="background:#eee; color:#333" onclick="addProductRow('','')">+ Add Produto</button>

    <label style="margin-top:20px">2. Tabela de Fotolivros (JSON Avançado)</label>
    <p style="font-size:11px; color:#666">Edite os preços dos álbuns aqui (Cuidado com a pontuação).</p>
    <textarea id="jsonTable" rows="6"></textarea>

    <div class="row" style="margin-top:15px">
        <div class="col"><label>Config Album Inclusas</label><input type="number" id="dbIncluso"></div>
        <div class="col"><label>Config Valor Extra</label><input type="number" id="dbExtra"></div>
    </div>

    <button class="btn-save" onclick="savePricesToGitHub()">💾 SALVAR TUDO NO GITHUB</button>
</div>

<div class="card">
    <h2>📸 Nova Galeria</h2>
    <label>Nome do Cliente (Link)</label>
    <input type="text" id="clientName" placeholder="maria-15anos">

    <label>Fotos</label>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">Clique ou Arraste as Fotos</div>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
    
    <div id="statusBox" class="status-box"></div>
    <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>

    <label style="color:#0969da; margin-top:20px">🎁 Brindes / Créditos</label>
    <div class="row">
        <div class="col" style="flex:2"><select id="giftSelector"></select></div>
        <div class="col"><input type="number" id="giftQtd" value="1"></div>
        <div class="col"><button style="margin-top:5px; background:#0969da; color:fff" onclick="addGift()">Add</button></div>
    </div>
    <div id="giftDisplay" style="margin-top:5px; font-size:12px"></div>

    <div class="row">
        <div class="col"><label>Álbum (Inclusas)</label><input type="number" id="albIncluso"></div>
        <div class="col"><label>Extra (R$)</label><input type="number" id="albExtra"></div>
        <div class="col"><label>Sinal (R$)</label><input type="number" id="valEntrada" value="0"></div>
    </div>

    <button class="btn-primary" id="btnDeploy" onclick="deploy()">🚀 CRIAR GALERIA</button>
</div>

<div id="finalLink" class="final-link"></div>

<script>
let selectedFiles=[], clientGifts=[];

window.onload=()=>{
    ['ghToken','ghUser','ghRepo'].forEach(k=>{if(localStorage.getItem(k))document.getElementById(k).value=localStorage.getItem(k)});
    if(typeof DB_CONFIG!=='undefined'){
        document.getElementById('visualList').innerHTML='';
        DB_CONFIG.produtos.forEach(p=>addProductRow(p.nome,p.preco));
        // Carrega tabela de fotolivro no Textarea
        document.getElementById('jsonTable').value = JSON.stringify(DB_CONFIG.calculo.tabela, null, 2);
        
        document.getElementById('dbIncluso').value=DB_CONFIG.album.incluso;
        document.getElementById('dbExtra').value=DB_CONFIG.album.extra;
        document.getElementById('albIncluso').value=DB_CONFIG.album.incluso;
        document.getElementById('albExtra').value=DB_CONFIG.album.extra;
        
        let s=document.getElementById('giftSelector');
        DB_CONFIG.produtos.forEach(p=>{let o=document.createElement('option');o.value=p.nome;o.innerText=p.nome;s.appendChild(o)});
    }
}

function addProductRow(n,p){
    let d=document.createElement('div');d.className='prod-row';
    d.innerHTML=`<input type="text" class="inp-name" value="${n}"><input type="number" class="inp-price" value="${p}"><button class="btn-del" onclick="this.parentElement.remove()">X</button>`;
    document.getElementById('visualList').appendChild(d);
}

function addGift(){
    let s=document.getElementById('giftSelector'), q=document.getElementById('giftQtd');
    if(!s.value)return;
    clientGifts.push({nome:s.value,qtd:parseInt(q.value)});
    let d=document.getElementById('giftDisplay');
    d.innerHTML+=`<span style="background:#0969da;color:white;padding:2px 6px;border-radius:4px;margin-right:5px">${q.value}x ${s.value}</span>`;
}

function handleFiles(f){
    selectedFiles=Array.from(f);
    document.getElementById('statusBox').style.display='block';
    document.getElementById('statusBox').innerText=`${selectedFiles.length} FOTOS PRONTAS`;
}

async function savePricesToGitHub(){
    // 1. Produtos
    let prods=[];
    document.querySelectorAll('.prod-row').forEach(r=>{
        let n=r.querySelector('.inp-name').value, p=parseFloat(r.querySelector('.inp-price').value);
        if(n) prods.push({nome:n,preco:p});
    });

    // 2. Tabela Fotolivro (Lê do Textarea)
    let tabelaCalc;
    try {
        tabelaCalc = JSON.parse(document.getElementById('jsonTable').value);
    } catch(e) {
        return alert("Erro no JSON da Tabela de Fotolivros. Verifique as vírgulas e aspas.");
    }

    let newDB = {
        album: { incluso:parseFloat(document.getElementById('dbIncluso').value), extra:parseFloat(document.getElementById('dbExtra').value) },
        calculo: { 
            markup: DB_CONFIG.calculo.markup, 
            custoFixo: DB_CONFIG.calculo.custoFixo, 
            regras: DB_CONFIG.calculo.regras,
            tabela: tabelaCalc // Usa a tabela nova
        },
        produtos: prods,
        creditos: []
    };

    // Upload DB
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    let url=`https://api.github.com/repos/${user}/${repo}/contents/database.js`;
    let content = `// Config Studio NBV\nconst DB_CONFIG = ${JSON.stringify(newDB,null,4)};`;
    
    try {
        let check = await fetch(url,{headers:{Authorization:`token ${token}`}});
        let sha = (await check.json()).sha;
        await fetch(url,{method:'PUT',headers:{Authorization:`token ${token}`},body:JSON.stringify({message:"Update DB",content:btoa(content),sha:sha,branch:"main"})});
        alert("Salvo com sucesso! Recarregue.");
        location.reload();
    } catch(e){alert("Erro ao salvar: "+e.message)}
}

// Deploy Simplificado
async function deploy(){
    let token=document.getElementById('ghToken').value, user=document.getElementById('ghUser').value, repo=document.getElementById('ghRepo').value;
    let name=document.getElementById('clientName').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
    
    if(!name || !selectedFiles.length) return alert("Faltam dados!");
    
    document.getElementById('progBar').style.display='block';
    let fill = document.getElementById('progFill');
    let fileNames=[];
    
    try {
        // Upload Fotos
        for(let i=0; i<selectedFiles.length; i++){
            let f=selectedFiles[i];
            fill.style.width = ((i/selectedFiles.length)*90)+'%';
            
            let reader = new FileReader();
            let b64 = await new Promise(r=>{reader.onload=()=>r(reader.result.split(',')[1]);reader.readAsDataURL(f)});
            
            let path = `clientes/${name}/${f.name}`;
            // Check SHA
            let sha=null; try{let c=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`}}); if(c.ok)sha=(await c.json()).sha;}catch(e){}
            
            await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`,{
                method:'PUT',
                headers:{Authorization:`token ${token}`},
                body:JSON.stringify({message:`Img`,content:b64,sha:sha,branch:'main'})
            });
            fileNames.push(f.name);
        }

        // Upload HTML
        let tpl = await(await fetch('template.html')).text();
        let injection = `
            let fotos = [${fileNames.map(f=>`"${f}"`).join(',')}];
            let albumConfig = { incluso: ${document.getElementById('albIncluso').value}, extra: ${document.getElementById('albExtra').value} };
            let produtos = ${JSON.stringify(DB_CONFIG.produtos)};
            let creditos = ${JSON.stringify(clientGifts)}; 
            let entrada = ${document.getElementById('valEntrada').value};
            let calculoConfig = ${JSON.stringify(DB_CONFIG.calculo)};
        `;
        let finalHtml = tpl.replace('// DATA_INJECTION_POINT', injection);
        
        let hPath=`clientes/${name}/index.html`;
        let hSha=null; try{let c=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${hPath}`,{headers:{Authorization:`token ${token}`}}); if(c.ok)hSha=(await c.json()).sha;}catch(e){}
        
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${hPath}`,{
            method:'PUT', headers:{Authorization:`token ${token}`},
            body:JSON.stringify({message:`HTML`,content:btoa(unescape(encodeURIComponent(finalHtml))),sha:hSha,branch:'main'})
        });

        fill.style.width='100%';
        let link=`https://${user}.github.io/${repo}/clientes/${name}/`;
        document.getElementById('finalLink').style.display='block';
        document.getElementById('finalLink').innerHTML=`<a href="${link}" target="_blank">ABRIR GALERIA</a>`;
        
    } catch(e){ alert("Erro: "+e.message); }
}

function saveConfig(){ ['ghToken','ghUser','ghRepo'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value)); }
</script>
</body>
</html>
